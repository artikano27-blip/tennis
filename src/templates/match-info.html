{% extends "base.html" %}

{% block content %}


<main>
    <div class="container">
        <h1>Матч завершен победил {{match_info.winner.name}}</h1>
        <div class="current-match-image"></div>
        <section class="score">
            <table class="table">
                <thead class="result">
                <tr>
                    <th class="table-text">Player</th>
                    <th class="table-text">Sets</th>
                </tr>
                </thead>
                <tbody>
                <tr class="player1">
                    <td class="table-text">{{match_info.player1.name}}</td>
                    <td class="table-text">{{player1_sets}}</td>

                </tr>

                <tr class="player2">
                    <td class="table-text">{{match_info.player2.name}}</td>
                    <td class="table-text">{{player2_sets}}</td>
                </tr>
                </tbody>
            </table>
        </section>
    </div>
</main>
<footer>
    <div class="footer">
        <p>&copy; Tennis Scoreboard, project from <a href="https://zhukovsd.github.io/java-backend-learning-course/">zhukovsd/java-backend-learning-course</a> roadmap.</p>
    </div>
</footer>

{% endblock %}
