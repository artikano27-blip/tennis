{% extends "base.html" %}

{% block content %}


<main>
    <div class="container">
        <div>
            <h1>Start new match</h1>
            <div class="new-match-image"></div>
            <div class="form-container center">
                <form method="post" action="/new-match">
                    <p style="color: red;">Sample error message</p>
                    <label class="label-player" for="player1">Player one</label>
                    <input id="player1" name="player1" class="input-player" placeholder="Name" type="text" required title="Enter a name">
                    <label class="label-player" for="player2">Player two</label>
                    <input id="player2" name="player2" class="input-player" placeholder="Name" type="text" required title="Enter a name">
                    <input class="form-button" type="submit" value="Start">
                </form>
            </div>
        </div>
    </div>
</main>
<footer>
    <div class="footer">
        <p>&copy; Tennis Scoreboard, project from <a href="https://zhukovsd.github.io/java-backend-learning-course/">zhukovsd/java-backend-learning-course</a> roadmap.</p>
    </div>
</footer>

{% endblock %}
